<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <title>Luna</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
  <link rel="icon" href="favicon.ico" sizes="48x48">
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="theme-color" content="#5b3fb8">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Luna">
  <script>
    // Apply the saved theme before Angular boots to avoid a light flash.
    // Key must match THEME_STORAGE_KEY in core/services/theme.service.ts.
    (function () {
      try {
        var pref = localStorage.getItem('luna.theme');
        // Light unless dark was chosen, or "system" on a dark device (default: light).
        var dark = pref === 'dark' ||
          (pref === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
        // Color palette; key must match PALETTE_STORAGE_KEY in core/services/palette.service.ts.
        var palette = localStorage.getItem('luna.palette');
        if (palette && palette !== 'luna') {
          document.documentElement.setAttribute('data-palette', palette);
        }
      } catch (e) {
        // Storage blocked: the default, light.
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>
</head>
<body>
  <lu-root></lu-root>
</body>
</html>
