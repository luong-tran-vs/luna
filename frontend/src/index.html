<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <title>Luna</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <script>
    // Apply the saved theme before Angular boots to avoid a light flash.
    // Key must match THEME_STORAGE_KEY in core/services/theme.service.ts.
    (function () {
      try {
        var pref = localStorage.getItem('luna.theme');
        var dark = pref === 'dark' ||
          (pref !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      } catch (e) {
        // Storage blocked: the prefers-color-scheme rule in tokens.css still applies.
      }
    })();
  </script>
</head>
<body>
  <lu-root></lu-root>
</body>
</html>
