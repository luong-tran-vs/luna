@if (open()) {
  <div class="backdrop">
    <div
      #dialog
      class="dialog"
      role="alertdialog"
      aria-modal="true"
      aria-labelledby="confirm-title"
      aria-describedby="confirm-message"
      tabindex="-1"
      (keydown)="trapTab($event)"
    >
      <h2 class="title" id="confirm-title">{{ title() }}</h2>
      <p class="message" id="confirm-message">{{ message() }}</p>
      <!-- What a page adds between the message and the buttons (a list to tick, added 2026-11-12). -->
      <ng-content />
      <div class="actions">
        <button #cancel type="button" class="btn" (click)="cancelled.emit()">
          {{ cancelLabel() }}
        </button>
        <button
          #confirm
          type="button"
          class="btn-primary"
          [class.btn-danger]="danger()"
          [disabled]="confirmDisabled()"
          (click)="confirmed.emit()"
        >
          {{ confirmLabel() }}
        </button>
      </div>
    </div>
  </div>
}
