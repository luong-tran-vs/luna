<div class="region" role="status" aria-live="polite">
  @if (notifier.toast(); as t) {
    <div class="toast" [attr.data-status]="t.status">
      <p class="message">{{ t.message }}</p>
      <a class="btn" [routerLink]="['/writings', t.writingId]" (click)="notifier.dismissToast()">Xem</a>
      <button type="button" class="close" aria-label="Đóng thông báo" (click)="notifier.dismissToast()">✕</button>
    </div>
  }
</div>
