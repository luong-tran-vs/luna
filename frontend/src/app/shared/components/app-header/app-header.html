<ng-template #themeIcon let-value>
  <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
    @if (value === 'dark') {
      <path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z" />
    } @else {
      <circle cx="12" cy="12" r="4" />
      <path
        d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"
      />
    }
  </svg>
</ng-template>

<header class="header">
  <a class="brand" routerLink="/">Luna</a>

  @if (auth.currentUser(); as user) {
    <nav class="account" aria-label="Tài khoản">
      <span class="email" [title]="user.email">{{ user.email }}</span>
      <a class="account-link" routerLink="/lessons">Bài học</a>
      <a
        class="account-link"
        routerLink="/writings"
        [attr.aria-label]="notifier.unseen() > 0 ? 'Bài viết, ' + notifier.unseen() + ' kết quả mới' : null"
      >
        Bài viết
        @if (notifier.unseen() > 0) {
          <span class="badge" aria-hidden="true">{{ notifier.unseen() }}</span>
        }
      </a>
      <a class="account-link" routerLink="/vocabulary">Sổ từ</a>
      <a class="account-link" routerLink="/settings">Cài đặt</a>
      @if (auth.isAdmin()) {
        <a class="account-link" routerLink="/admin">Quản trị</a>
      }
    </nav>
  }

  <div class="actions">
    <button
      type="button"
      class="theme-trigger"
      [cdkMenuTriggerFor]="themeMenu"
      [cdkMenuPosition]="menuPositions"
      [attr.aria-label]="'Giao diện: ' + current().label"
    >
      <ng-container *ngTemplateOutlet="themeIcon; context: { $implicit: current().value }" />
      <span class="theme-label">{{ current().label }}</span>
      <svg class="chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6" /></svg>
    </button>

    @if (auth.currentUser()) {
      <button type="button" class="account-link" (click)="logout()">Đăng xuất</button>
    }
  </div>
</header>

<ng-template #themeMenu>
  <div class="theme-menu" cdkMenu aria-label="Giao diện">
    @for (option of options; track option.value) {
      <button
        type="button"
        class="theme-item"
        cdkMenuItemRadio
        [cdkMenuItemChecked]="current().value === option.value"
        (cdkMenuItemTriggered)="select(option.value)"
      >
        <ng-container *ngTemplateOutlet="themeIcon; context: { $implicit: option.value }" />
        <span class="theme-item-label">{{ option.label }}</span>
        @if (current().value === option.value) {
          <svg class="check" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5" /></svg>
        }
      </button>
    }
  </div>
</ng-template>
