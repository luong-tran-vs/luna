<header class="bar">
  <a class="brand" routerLink="/">Luna</a>
  <nav class="tabs" aria-label="Menu chính">
    <!-- Phone: the glass droplet behind the current tab, sliding from tab to tab. -->
    <span
      class="droplet"
      aria-hidden="true"
      [class.is-shown]="current() >= 0"
      [style.--at]="current() < 0 ? 0 : current()"
    ></span>
    @for (tab of tabs; track tab.path) {
      @if (tab.practice) {
        <lu-practice-menu class="practice" [active]="tab.matches(path())" />
      } @else {
        @let badge = tab.path === '/account' ? notifier.unseen() : 0;
        <a
          class="tab"
          [class.tab-end]="tab.path === '/account'"
          [routerLink]="tab.path"
          [attr.aria-current]="tab.matches(path()) ? 'page' : null"
          [attr.aria-label]="badge > 0 ? tab.label + ', ' + badge + ' kết quả bài viết mới' : null"
        >
          <span class="tab-icon">
            <lu-icon [name]="tab.icon" />
            @if (badge > 0) {
              <span class="dot-badge" aria-hidden="true">{{ badge }}</span>
            }
          </span>
          <span class="tab-label">{{ tab.label }}</span>
        </a>
      }
    }
  </nav>
  <button
    type="button"
    class="theme-toggle"
    aria-label="Chế độ tối"
    [attr.aria-pressed]="dark()"
    [title]="dark() ? 'Chuyển sang giao diện sáng' : 'Chuyển sang giao diện tối'"
    (click)="toggleDark()"
  >
    <lu-icon [name]="dark() ? 'sun' : 'moon'" />
  </button>
</header>
<main>
  <router-outlet />
</main>
<footer class="app-footer">
  <lu-connection-status />
</footer>
<lu-toast />
