<div class="search">
  <lu-icon name="search" class="search-icon" />
  <label class="visually-hidden" for="verb-search">Tìm động từ</label>
  <input
    #search
    id="verb-search"
    type="search"
    placeholder="Tìm: go, went, đi…"
    autocomplete="off"
    autocapitalize="off"
    spellcheck="false"
    [value]="query()"
    (input)="onSearch($event)"
  />
  @if (query()) {
    <button type="button" class="clear" aria-label="Xoá ô tìm" (click)="clearSearch(search)">
      <lu-icon name="x" />
    </button>
  }
</div>

<!-- One row that scrolls sideways: the list, then the four patterns (tap one again to clear it). -->
<div class="chips">
  <div class="chip-group" role="group" aria-label="Danh sách">
    <button type="button" class="chip" [attr.aria-pressed]="!commonOnly()" (click)="commonOnly.set(false)">
      Tất cả <span class="count">{{ total() }}</span>
    </button>
    <button type="button" class="chip" [attr.aria-pressed]="commonOnly()" (click)="commonOnly.set(true)">
      <lu-icon name="flame" /> Thông dụng <span class="count">{{ commonTotal() }}</span>
    </button>
  </div>
  <div class="chip-group" role="group" aria-label="Nhóm theo cách biến đổi">
    @for (p of patterns; track p.key) {
      <button
        type="button"
        class="chip pattern"
        [attr.aria-pressed]="pattern() === p.key"
        [title]="p.hintVi + ' Ví dụ: ' + p.example"
        (click)="togglePattern(p.key)"
      >
        {{ p.label }} <span class="example" lang="en">{{ p.example.split(' ')[0] }}</span>
        <span class="count">{{ counts()[p.key] }}</span>
      </button>
    }
  </div>
</div>
