<section class="soft-card summary" aria-labelledby="summary-heading">
  <h2 class="step-title" id="summary-heading" tabindex="-1">Xong phần luyện tập</h2>

  @if (items().length) {
    <lu-practice-list [items]="items()" (go)="go.emit($event)" />
  }

  <button type="button" class="btn btn-block" (click)="retry.emit()">
    <lu-icon name="review" /> Làm lại
  </button>

  @switch (status()) {
    @case ('completed') {
      <div class="review-actions">
        <a
          class="btn-primary btn-block"
          [routerLink]="['/lessons', lessonId(), 'read']"
          [queryParams]="{ review: 1 }"
          >Đọc lại</a
        >
        <a
          class="btn btn-block"
          [routerLink]="['/lessons', lessonId(), 'listen']"
          [queryParams]="{ review: 1 }"
          >Nghe lại</a
        >
        <a
          class="btn btn-block"
          [routerLink]="['/lessons', lessonId(), 'write']"
          [queryParams]="{ review: 1 }"
          >Bài viết</a
        >
      </div>
    }
  }
</section>
