server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # Docker's embedded DNS. Resolving at request time (variable upstream) lets nginx
  # start and keep serving the app while the backend container is down.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $backend http://backend:8080;

  location /api/ {
    proxy_pass $backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;
    proxy_read_timeout 15s;
  }

  # AI lesson generation (F7) waits up to 120 s for the AI provider, so only this route
  # gets a longer read timeout. A regex location wins over the /api/ prefix above.
  location ~ ^/api/admin/topics/[^/]+/generate$ {
    proxy_pass $backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;
    proxy_read_timeout 135s;
  }

  # Hashed build assets and fonts never change for a given file name.
  location ~* \.(?:js|css|woff2)$ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }
}
