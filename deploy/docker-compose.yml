name: luna

# Every variable has a default, so `docker compose -f deploy/docker-compose.yml up --build`
# works on a fresh machine. Copy .env.example to .env (next to this file) to override.

services:
  mongo:
    image: mongo:8
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    ports:
      # Localhost only: lets a backend started with `go run` reach the database during development.
      - "127.0.0.1:27017:27017"

  # MySQL for DB_DRIVER=mysql. It starts only with the profile:
  #   docker compose -f deploy/docker-compose.yml --profile mysql up --build
  # together with DB_DRIVER=mysql in deploy/.env. MYSQL_PASSWORD defaults to a development value:
  # set your own in deploy/.env.
  mysql:
    image: mysql:8
    profiles: [mysql]
    restart: unless-stopped
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_bin"]
    environment:
      # The same MYSQL_* variables the backend reads below (the image refuses MYSQL_USER=root).
      MYSQL_DATABASE: ${MYSQL_DATABASE:-luna}
      MYSQL_USER: ${MYSQL_USER:-luna}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-luna}
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u${MYSQL_USER:-luna}", "-p${MYSQL_PASSWORD:-luna}"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      # Localhost only, like mongo.
      - "127.0.0.1:3306:3306"

  backend:
    build: ../backend
    restart: unless-stopped
    environment:
      # Which database the backend uses: mongo (default) or mysql (also start the mysql profile).
      DB_DRIVER: ${DB_DRIVER:-mongo}
      MONGO_URI: ${MONGO_URI:-mongodb://mongo:27017}
      MONGO_DATABASE: ${MONGO_DATABASE:-luna}
      # MySQL (used only when DB_DRIVER=mysql). Inside compose the host is the service name "mysql".
      # MYSQL_DSN, when set, replaces the parts. An empty pool setting means the backend default.
      MYSQL_DSN: ${MYSQL_DSN:-}
      MYSQL_HOST: ${MYSQL_HOST:-mysql}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      MYSQL_USER: ${MYSQL_USER:-luna}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-luna}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-luna}
      MYSQL_MAX_OPEN_CONNS: ${MYSQL_MAX_OPEN_CONNS:-}
      MYSQL_MAX_IDLE_CONNS: ${MYSQL_MAX_IDLE_CONNS:-}
      MYSQL_CONN_MAX_LIFETIME: ${MYSQL_CONN_MAX_LIFETIME:-}
      MYSQL_DIAL_TIMEOUT: ${MYSQL_DIAL_TIMEOUT:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Set to true when the app is served over HTTPS.
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # Lesson annotations: gemini (needs GEMINI_API_KEY) or none.
      AI_PROVIDER: ${AI_PROVIDER:-gemini}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      # Offline dictionary for the Reading step: run deploy/fetch-dictionary.sh (or .ps1) first.
      DICTIONARY_PATH: /data/dictionary/dictionary.db
    volumes:
      - ./data/dictionary:/data/dictionary:ro
    # Longer than the 10 s graceful shutdown so in-flight requests can finish.
    stop_grace_period: 15s
    depends_on:
      - mongo

  # Daily database backup at BACKUP_TIME (BACKUP_TZ), keeping the newest BACKUP_KEEP copies in
  # deploy/backups/. Restore with deploy/backup/restore.sh: see "Sao lưu và khôi phục" in README.md.
  backup:
    image: mongo:8
    restart: unless-stopped
    entrypoint: ["bash", "/backup/backup.sh"]
    environment:
      MONGO_URI: ${MONGO_URI:-mongodb://mongo:27017}
      MONGO_DATABASE: ${MONGO_DATABASE:-luna}
      TZ: ${BACKUP_TZ:-Asia/Ho_Chi_Minh}
      BACKUP_TIME: ${BACKUP_TIME:-03:00}
      BACKUP_KEEP: ${BACKUP_KEEP:-7}
      # 1: back up as soon as the service starts (then follow the schedule).
      BACKUP_NOW: ${BACKUP_NOW:-0}
    volumes:
      - ./backup:/backup:ro
      - ./backups:/backups
    depends_on:
      - mongo

  frontend:
    build: ../frontend
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8000}:80"
    depends_on:
      - backend

volumes:
  mongo-data:
  mysql-data:
